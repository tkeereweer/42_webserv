<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>408 — Request Timeout</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <header>
            <span class="header-title"
                ><a href="/index.html">At your Webservice</a></span
            >
        </header>
        <main class="main-error">
            <div class="error-code">413</div>
            <div class="error-message">Request Entity Too Large</div>
            <p class="error-desc">
                The client took too long to write request or read response.
            </p>
            <a href="/index.html" class="error-back">← Home</a>
        </main>
    </body>
</html>
