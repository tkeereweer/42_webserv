<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>At your Webservice — Files</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <header>
            <span class="header-title"
                ><a href="/index.html">At your Webservice</a></span
            >
        </header>
        <main>
            <h1 class="page-title">FILES</h1>
            <div>
                <form action="../cgi-bin/upload_handle.py" method="POST" enctype="multipart/form-data">
                    <label for="myfile">Select a file:</label>
                    <input type="file" id="myfile" name="myfile" />
                    <button type="submit" class="card">Upload</button>
                </form>
                <p><a href="../cgi-bin/list_files.py">View uploaded files</a></p>
            </div>
        </main>
    </body>
