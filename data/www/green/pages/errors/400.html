<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>400 — Bad Request</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>
    <body>
        <header>
            <span class="header-title"
                ><a href="/index.html">At your Webservice</a></span
            >
        </header>
        <main class="main-error">
            <h1 class="error-code">400</h1>
            <h2 class="error-message">Bad Request</h2>
            <p class="error-desc">
                The server could not understand the request due to invalid
                syntax.
            </p>
            <a href="/index.html" class="error-back">← Home</a>
        </main>
    </body>
</html>
