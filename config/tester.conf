server {
	listen 127.0.0.1/8080;
	listen 0.0.0.0/9090;

    location / {
        limit_except GET;
    }

    location /post_body {
        limit_except POST;
        client_max_body_size 100;
    }

    location /directory/ {
        limit_except GET;
        root /YoupiBanane;
        index youpi.bad_extension;
    }
}
