server {
	listen 127.0.0.1/8080;
	listen 127.0.0.1/9090;
	
	server_name webserv;

	error_page 405 /405.html;
	
	client_max_body_size 80000;
	
	location /some/path/ {
		root /src;
		limit_except GET, POST, DELETE;
		autoindex on;
		index index.html;
		upload_store /upload;
		error_page 404 /404.html;
		return 301 www.redirect.com;
	}
}