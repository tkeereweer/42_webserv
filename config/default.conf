server {
	listen 0.0.0.0/8080;

	server_name webserv;

	error_page 400 pages/errors/400.html;
    error_page 403 pages/errors/403.html;
    error_page 404 pages/errors/404.html;
    error_page 405 pages/errors/405.html;
    error_page 408 pages/errors/408.html;
    error_page 409 pages/errors/409.html;
    error_page 411 pages/errors/411.html;
    error_page 413 pages/errors/413.html;
    error_page 414 pages/errors/414.html;
    error_page 500 pages/errors/500.html;
    error_page 502 pages/errors/502.html;
    error_page 503 pages/errors/503.html;
    error_page 505 pages/errors/505.html;

	client_max_body_size 80000000;

	cgi_max_output_size 20000000;

	root /data/www/blue;

    location / {
        root /data/www/blue/pages;
        limit_except GET, POST;
        autoindex on;
        index index.html;
        error_page 400 errors/400.html;
        error_page 403 errors/403.html;
        error_page 404 errors/404.html;
        error_page 405 errors/405.html;
        error_page 408 errors/408.html;
        error_page 409 errors/409.html;
        error_page 411 errors/411.html;
        error_page 413 errors/413.html;
        error_page 414 errors/414.html;
        error_page 500 errors/500.html;
        error_page 502 errors/502.html;
        error_page 503 errors/503.html;
        error_page 505 errors/505.html;
        upload_store /data/upload;
    }

    location /upload {
        root /data;
        limit_except GET, POST, DELETE;
        upload_store /data;
    }

    location /files {
        return 301 http://127.0.0.1:8080/cgi-bin/list_files.py;
    }

    location /assets {
        autoindex on;
        limit_except GET;
    }

    location /css {
        autoindex off;
        limit_except GET;
    }

	location /cgi-bin {
        autoindex off;
        limit_except GET, POST;
    }

    location /redir.html {
        autoindex on;
        limit_except GET;
        return 301 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
    }
}

