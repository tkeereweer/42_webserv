server {
	listen 127.0.0.1/8080;
	listen 0.0.0.0/9090;

	server_name webserv;

	error_page 405 /405.html;

	client_max_body_size 80000000;

	cgi_max_output_size 20000000;

	root /data/www;
    index /index.html;

    location / {
        root /data/www/pages;
        autoindex on;
        index /index.html;
        upload_store /data/upload;
    }

    location /files {
        root /data/www;
        return 301 http://127.0.0.1:9090/cgi-bin/list_files.py;
    }

    location /assets {
        root /data/www;
        autoindex on;
    }

    location /css {
        root /data/www;
        autoindex on;
    }

	location /cgi-bin {
        root /data/www;
        autoindex on;
    }

	location /www/pages/ {
		root /data/www/pages;
		limit_except GET, POST, DELETE;
		autoindex on;
		index index.html;
		upload_store /upload;
		error_page 404 /404.html;
		return 301 www.redirect.com;
	}
}
